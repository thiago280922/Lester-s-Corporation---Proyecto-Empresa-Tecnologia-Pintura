<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.ico') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>CHAT - Empresa pinturas</title>
</head>
<body>

<section class="primer-seccion">
    <div class="avatar-bar-wrap">
        <div class="avatar-bar" id="avatarBar"></div>
    </div>
    <!-- Sección izquierda -->
    <section class="agregar">
        <button id="btn-posteos"><i class="fa-solid fa-plus"></i> Posteos</button>
        <button id="btn-buscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
    </section>

    <!-- Sección derecha (contactos dinámicos) -->
    <section class="contactos" id="lista-contactos">
        <!-- Aquí se cargarán los contactos desde el backend -->
    </section> 
</section>
    
<!-- Chat general -->
<section class="general">
    <ul class="chat-contenedor" id="chat-mensajes">
        <li class="posteo">Bienvenido al chat 🎉</li>
    </ul>

    <div class="formulario-posteo">
        <input type="text" id="input-mensaje" placeholder="Escribe un mensaje..." />
        <button id="btn-enviar"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</section>

<!-- Modal buscador de empleados -->
<div id="modal-buscar" class="modal">
    <div class="modal-contenido">
        <span id="cerrar-modal">&times;</span>
        <h2><i class="fa-solid fa-magnifying-glass"></i> Buscar empleado</h2>

        <input type="text" id="input-buscar-empleado" placeholder="Nombre o email sin @tecnologia">

        <button id="btn-buscar-empleado"><i class="fa-solid fa-search"></i> Buscar</button>
        <button id="btn-iniciar-chat">Iniciar chat</button>

        <ul id="lista-chats"></ul>
        <div id="resultado-busqueda"></div>
    </div>
</div>

<script>
const empleadoId = {{ empleado_id | tojson }};    
(function() {
    
    const btnEnviar = document.getElementById("btn-enviar");
    const inputMensaje = document.getElementById("input-mensaje");
    const chatMensajes = document.getElementById("chat-mensajes");

    const btnPosteos = document.getElementById("btn-posteos");

    btnPosteos.addEventListener("click", () => {
    window.location.href = "/posteos"; // o la ruta real si es otra
    });


    // ===========================
    // Renderizar mensajes
    // ===========================
    function renderMensajes(mensajes) {
        chatMensajes.innerHTML = "";
        if (mensajes.length === 0) {
            const li = document.createElement("li");
            li.classList.add("posteo");
            li.textContent = "Bienvenido al chat 🎉";
            chatMensajes.appendChild(li);
            return;
        }
        mensajes.forEach(msg => {
            const li = document.createElement("li");
            li.classList.add("posteo");
            li.textContent = `${msg.usuario}: ${msg.mensaje}`;
            chatMensajes.appendChild(li);
        });
    }

    async function cargarMensajes() {
        const res = await fetch("/chat/mensajes");
        const data = await res.json();
        renderMensajes(data);
    }

    async function enviarMensaje() {
        const mensaje = inputMensaje.value.trim();
        if (!mensaje) return;

        await fetch("/chat/enviar", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ mensaje })
        });
        inputMensaje.value = "";
        cargarMensajes();
    }

    btnEnviar.addEventListener("click", enviarMensaje);
    inputMensaje.addEventListener("keypress", e => {
        if (e.key === "Enter") enviarMensaje();
    });

    cargarMensajes();
    setInterval(cargarMensajes, 2000);

    // ===========================
    // Contactos
    // ===========================
     async function cargarContactos() {
        const res = await fetch("/contactos");
        const data = await res.json();

        const lista = document.getElementById("lista-contactos");
        lista.innerHTML = "";

        if (data.length === 0) return;

        data.forEach(emp => {
            const btn = document.createElement("button");
            btn.innerHTML = `<i class="fa-solid fa-user"></i> ${emp.usuario}`;

            btn.addEventListener("click", () => {
                window.location.href = `/chat_directo/${empleadoId}/${emp.id}`;
            });

            lista.appendChild(btn);
        });
    }

    cargarContactos();

    // ===========================
    // Modal Buscar empleado
    // ===========================
    const modal = document.getElementById("modal-buscar");
    const btnBuscar = document.getElementById("btn-buscar");
    const btnCerrar = document.getElementById("cerrar-modal");
    const btnBuscarEmpleado = document.getElementById("btn-buscar-empleado");
    const btnIniciarChat = document.getElementById("btn-iniciar-chat");

    let ultimoEmpleadoEncontrado = null;

    // abrir modal
    btnBuscar.addEventListener("click", () => {
        modal.style.display = "block";
    });

    // cerrar modal
    btnCerrar.addEventListener("click", () => {
        modal.style.display = "none";
        document.getElementById("resultado-busqueda").innerHTML = "";
        document.getElementById("input-buscar-empleado").value = "";
        ultimoEmpleadoEncontrado = null;
    });

    // buscar empleado
    btnBuscarEmpleado.addEventListener("click", async () => {
        const query = document.getElementById("input-buscar-empleado").value.trim();
        if (!query) return;

        const res = await fetch(`/buscar_empleado?id=${encodeURIComponent(query)}`);
        const data = await res.json();

        const resultado = document.getElementById("resultado-busqueda");
        if (data.error) {
            resultado.textContent = data.error;
            resultado.style.color = "red";
            ultimoEmpleadoEncontrado = null;
        } else {
            resultado.textContent = `Encontrado: ${data.usuario} (${data.email})`;
            resultado.style.color = "green";
            ultimoEmpleadoEncontrado = data;
        }
    });

    btnIniciarChat.addEventListener("click", async () => {
        if (!ultimoEmpleadoEncontrado) return;

        try {
            const res = await fetch("/contactos/agregar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ contacto_id: ultimoEmpleadoEncontrado.id })
            });
            const data = await res.json();

            if (data.error) {
                document.getElementById("resultado-busqueda").textContent = data.error;
                document.getElementById("resultado-busqueda").style.color = "red";
            } else {
                // redirigir directo al chat con ambos IDs
                window.location.href = `/chat_directo/${empleadoId}/${ultimoEmpleadoEncontrado.id}`;
            }
        } catch (err) {
            console.error("Error al iniciar chat:", err);
        }
    });

    

})();
</script>



</body>
</html>
